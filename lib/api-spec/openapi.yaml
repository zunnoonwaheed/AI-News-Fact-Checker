openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FactCheck News API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: factcheck
    description: Fact checking operations
  - name: history
    description: Check history operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /factcheck:
    post:
      operationId: checkFact
      tags: [factcheck]
      summary: Check a news claim or article
      description: Analyzes a news claim or article text and returns fact-checking results with sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactCheckRequest"
      responses:
        "200":
          description: Fact check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactCheckResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /factcheck/history:
    get:
      operationId: getCheckHistory
      tags: [history]
      summary: Get recent fact check history
      description: Returns recent fact check results
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: verdict
          in: query
          schema:
            type: string
            enum: [verified, false, misleading, unverified, partially_true]
      responses:
        "200":
          description: List of recent fact checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactCheckHistoryResponse"

  /factcheck/stats:
    get:
      operationId: getFactCheckStats
      tags: [factcheck]
      summary: Get fact checking statistics
      description: Returns aggregate statistics about fact checks performed
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactCheckStats"

  /factcheck/{id}:
    get:
      operationId: getFactCheckById
      tags: [factcheck]
      summary: Get a specific fact check result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fact check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactCheckResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    FactCheckRequest:
      type: object
      properties:
        query:
          type: string
          description: The news claim, headline, or article text to fact-check
        url:
          type: string
          description: Optional URL of the news article
      required:
        - query

    Source:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        publishedAt:
          type: string
        description:
          type: string
        credibilityScore:
          type: number
          description: 0-100 credibility score of the source
      required:
        - name
        - url

    Claim:
      type: object
      properties:
        text:
          type: string
          description: The specific claim extracted from the article
        verdict:
          type: string
          enum: [verified, false, misleading, unverified, partially_true]
        explanation:
          type: string
          description: Explanation of the verdict
        confidence:
          type: number
          description: Confidence level 0-100
      required:
        - text
        - verdict
        - explanation
        - confidence

    FactCheckResult:
      type: object
      properties:
        id:
          type: integer
        query:
          type: string
        overallVerdict:
          type: string
          enum: [verified, false, misleading, unverified, partially_true]
        credibilityScore:
          type: number
          description: Overall credibility score 0-100
        summary:
          type: string
          description: Summary of the fact-check analysis
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        relatedArticles:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        checkedAt:
          type: string
          format: date-time
        analysisDetails:
          type: string
          description: Detailed analysis from AI
      required:
        - id
        - query
        - overallVerdict
        - credibilityScore
        - summary
        - claims
        - sources
        - checkedAt

    FactCheckHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FactCheckResult"
        total:
          type: integer
      required:
        - items
        - total

    FactCheckStats:
      type: object
      properties:
        totalChecked:
          type: integer
        verdictBreakdown:
          type: object
          additionalProperties:
            type: integer
        averageCredibilityScore:
          type: number
        recentChecks:
          type: integer
          description: Checks in the last 24 hours
      required:
        - totalChecked
        - verdictBreakdown
        - averageCredibilityScore
        - recentChecks

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
